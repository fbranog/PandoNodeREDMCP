[project]
name = "nodered-flow-mcp"
version = "0.1.0"
description = "MCP server for engineering Node-RED flows via the Admin API"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0,<3",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
]

[project.scripts]
nodered-flow-mcp = "nodered_flow_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodered_flow_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
